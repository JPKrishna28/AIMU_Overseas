<svg width="640" height="512" viewBox="0 0 640 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fuse" x1="120" y1="150" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#b9c9ee"/>
    </linearGradient>
    <linearGradient id="wing" x1="180" y1="230" x2="470" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dbe4fb"/>
      <stop offset="1" stop-color="#9db4e6"/>
    </linearGradient>
    <linearGradient id="tail" x1="470" y1="120" x2="560" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f86ec"/>
      <stop offset="1" stop-color="#2f5fc7"/>
    </linearGradient>
    <linearGradient id="stripe" x1="120" y1="250" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b93f0"/>
      <stop offset="1" stop-color="#2f5fc7"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12204a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#12204a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="330" cy="452" rx="230" ry="34" fill="url(#shadow)"/>

  <g transform="rotate(-12 320 256)">
    <!-- far wing -->
    <path d="M300 250 L150 150 L188 148 L332 236 Z" fill="url(#wing)" opacity="0.75"/>
    <!-- tail fin -->
    <path d="M486 232 L470 96 L500 96 L556 214 L520 232 Z" fill="url(#tail)"/>
    <!-- horizontal stabilizers -->
    <path d="M486 236 L556 210 L578 220 L500 250 Z" fill="url(#wing)"/>
    <!-- fuselage -->
    <path d="M96 292
             C96 268 132 250 210 244
             L470 226
             C520 224 552 236 560 252
             C552 268 520 280 470 282
             L210 300
             C132 300 96 300 96 292 Z" fill="url(#fuse)"/>
    <!-- belly stripe -->
    <path d="M120 290 L470 274 C505 273 520 278 520 284 L150 300 C130 300 120 296 120 290 Z" fill="url(#stripe)"/>
    <!-- nose cone -->
    <path d="M96 292 C96 276 108 262 124 258 C120 272 120 288 124 300 C108 300 96 300 96 292 Z" fill="#2f5fc7"/>
    <!-- cockpit windows -->
    <path d="M150 262 l24 -2 l-2 12 l-24 2 z" fill="#1c356e" opacity="0.9"/>
    <!-- cabin windows -->
    <g fill="#8fa8d8">
      <circle cx="220" cy="266" r="3.5"/>
      <circle cx="248" cy="264" r="3.5"/>
      <circle cx="276" cy="262" r="3.5"/>
      <circle cx="304" cy="260" r="3.5"/>
      <circle cx="332" cy="258" r="3.5"/>
      <circle cx="360" cy="256" r="3.5"/>
      <circle cx="388" cy="254" r="3.5"/>
      <circle cx="416" cy="252" r="3.5"/>
    </g>
    <!-- near wing -->
    <path d="M300 280 L470 372 L430 378 L286 292 Z" fill="url(#wing)"/>
    <!-- engine -->
    <ellipse cx="352" cy="312" rx="26" ry="14" fill="#c7d5f0"/>
    <ellipse cx="332" cy="312" rx="8" ry="12" fill="#1c356e"/>
  </g>
</svg>
